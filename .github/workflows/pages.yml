name: Validate and deploy LIBERA-1899

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate game files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate AI sandbox files
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          grep -q '^:root' styles.css
          grep -q '<script type="module" src="src/app.js"></script>' index.html
          grep -q 'export const WORLD_CANON' src/world-canon.js
          grep -q 'window.HUA_GAME_BRIDGE' src/game.js

          if grep -Eq 'src/(story|encounters)\.js' index.html; then
            echo 'index.html vẫn tham chiếu file truyện cố định đã bị loại bỏ.' >&2
            exit 1
          fi

  pages_state:
    name: Check Pages configuration
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check whether Pages uses GitHub Actions
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output pages.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)"

          if [ "$status" = "200" ]; then
            build_type="$(python -c 'import json; print(json.load(open("pages.json", encoding="utf-8")).get("build_type", ""))')"
            if [ "$build_type" = "workflow" ]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=GitHub Pages chưa dùng Actions::Vào Settings > Pages > Build and deployment > Source và chọn GitHub Actions.'
            exit 0
          fi

          echo 'ready=false' >> "$GITHUB_OUTPUT"
          if [ "$status" = "404" ]; then
            echo '::notice title=GitHub Pages chưa được bật::Vào Settings > Pages > Build and deployment > Source và chọn GitHub Actions.'
          else
            echo "::warning title=Không đọc được cấu hình Pages::HTTP ${status}. Deployment được bỏ qua để không làm hỏng toàn bộ workflow."
            cat pages.json 2>/dev/null || true
          fi

  deploy:
    name: Deploy playtest
    needs:
      - validate
      - pages_state
    if: needs.pages_state.outputs.ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  pages_not_enabled:
    name: Pages setup required
    needs:
      - validate
      - pages_state
    if: needs.pages_state.outputs.ready != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain required repository setting
        run: |
          echo 'Game validation passed.'
          echo 'Deployment was skipped because GitHub Pages is not configured to use GitHub Actions.'
          echo 'Open Settings > Pages > Build and deployment > Source, then select GitHub Actions.'
