name: Release Android APK

on:
  push:
    branches: [main]
    paths:
      - "release/VERSION"
      - ".github/workflows/release-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_DIRECTOR_MODEL: ${{ vars.GEMINI_DIRECTOR_MODEL }}
      GEMINI_WRITER_MODEL: ${{ vars.GEMINI_WRITER_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < release/VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          grep -Fq "versionName = \"${version}\"" android/app/build.gradle.kts
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Preflight standalone APK
        run: npm run check

      - name: Build installable APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Verify bundled runtime
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$apk" > apk-files.txt
          grep -q 'assets/www/index.html' apk-files.txt
          grep -q 'assets/www/src/native-ai-pipeline.js' apk-files.txt
          grep -q 'assets/www/apk-ai/gemini-prompts.js' apk-files.txt
          grep -q 'assets/www/apk-ai/gemini-schemas.js' apk-files.txt
          grep -q 'assets/www/apk-ai/gemini-state.js' apk-files.txt

      - name: Prepare release files
        id: files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          apk="HuaGia-LIBERA-1899-v${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          sha256sum "$apk" > "${apk}.sha256"
          echo "apk=${apk}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.files.outputs.apk }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists." >&2
            exit 1
          fi

          cat > release-notes.md <<EOF
          ## Hứa Gia: LIBERA-1899 v${VERSION}

          First standalone Android release.

          - Vercel and the legacy web backend are removed from the repository runtime.
          - The APK bundles the UI, canon, Gemini prompt/schema/state modules and native AI pipeline.
          - Gemini calls run through the Android native bridge using API keys entered and encrypted on-device.
          - The attached APK is the installable debug-signed GitHub build because a production signing key is not configured in the repository.

          Verification: preflight, Gradle build and bundled-runtime archive checks all run before this release is created.
          EOF

          gh release create "$TAG" \
            "$APK" \
            "${APK}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Hứa Gia: LIBERA-1899 v${VERSION}" \
            --notes-file release-notes.md
