name: Kiểm tra Gemini API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "api/gemini-turn.js"
      - "scripts/test-gemini.mjs"
      - "package.json"
      - ".github/workflows/gemini-smoke-test.yml"

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kiểm tra cú pháp
        run: npm run check

      - name: Gọi thử Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
        run: npm run test:gemini
